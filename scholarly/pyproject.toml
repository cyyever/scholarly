[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "scholarly"
version = "0.1.0"
description = "A Python library for retrieving Google Scholar data"
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "arrow>=1.4.0",
    "bibtexparser>=2.0.0",
    "beautifulsoup4>=4.15.0",
    "deprecated>=1.2.18",
    "free-proxy>=1.3.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "selenium>=4.51.0",
    "urllib3>=2.5.0",
]

[project.scripts]
scholarly = "scholarly.cli:main"

[project.optional-dependencies]
fake-useragent = ["fake-useragent"]
tor = ["stem"]

[tool.setuptools]
packages = ["scholarly"]
package-dir = {scholarly = "."}
